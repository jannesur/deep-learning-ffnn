<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TFJS Regression</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>

<header>
    <h1>FFNN Regression mit TensorFlow.js</h1>
</header>

<main>

    <section>

        <h2>R1 - Datensätze</h2>

        <div class="plot-grid">

            <div>
                <h3>Ohne Rauschen</h3>
                <div id="dataset-plot"></div>
            </div>

            <div>
                <h3>Mit Rauschen</h3>
                <div id="noisy-dataset-plot"></div>
            </div>

        </div>

    </section>


    <section>

        <h2>R2 - Modell ohne Rauschen</h2>

        <div class="plot-grid">

            <div>
                <h3>Trainingsdaten</h3>
                <div id="clean-train-prediction-plot"></div>
            </div>

            <div>
                <h3>Testdaten</h3>
                <div id="clean-test-prediction-plot"></div>
            </div>

        </div>

        <div id="clean-loss-output">

            <p>
                Clean Train Loss:
                <span id="clean-train-loss">-</span>
            </p>

            <p>
                Clean Test Loss:
                <span id="clean-test-loss">-</span>
            </p>

        </div>

    </section>


    <section>

        <h2>Vergleich der Modellvorhersagen</h2>

        <div id="prediction-plot"></div>

        <div id="loss-output">

            <p>
                Train Loss:
                <span id="train-loss">-</span>
            </p>

            <p>
                Test Loss:
                <span id="test-loss">-</span>
            </p>

        </div>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
